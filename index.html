<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control</title>
<style>
:root{--navy:#0F172A;--cyan:#0EA5E9;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--bg:#F8FAFC;--card:#fff;--border:#E2E8F0;--muted:#94A3B8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--navy)}

/* Lock */
#lock{display:flex;align-items:center;justify-content:center;min-height:100vh}
#lock>div{text-align:center;background:var(--card);padding:3rem 2.5rem;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
#lock h2{margin-bottom:1.5rem;font-size:1.5rem}
#lock input{padding:.8rem 1.2rem;border:2px solid var(--border);border-radius:8px;font-size:1rem;width:240px;text-align:center}
#lock input:focus{outline:none;border-color:var(--cyan)}
.btn{display:inline-block;padding:.6rem 1.5rem;background:var(--cyan);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer}
.btn:active{opacity:.8}
#err{color:var(--red);font-size:.85rem;margin-top:.8rem;display:none}

/* Dashboard */
#dash{display:none;padding:1rem;max-width:1100px;margin:0 auto}
.header{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;padding-bottom:.7rem;border-bottom:2px solid var(--cyan);flex-wrap:wrap}
.header h1{font-size:1.3rem}.header .ts{color:var(--muted);font-size:.75rem;margin-left:auto}
.header .settings-btn{background:none;border:none;font-size:1.2rem;cursor:pointer;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.8rem}

/* Cards */
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.card-header{padding:.6rem .8rem;background:#F1F5F9;display:flex;align-items:center;gap:.4rem;cursor:pointer;list-style:none;user-select:none}
.card-header::-webkit-details-marker{display:none}
.card-title{font-weight:700;font-size:.82rem;flex:1}.icon{font-size:1rem}
.chev{color:var(--muted);font-size:.65rem;transition:transform .2s}
details:not([open]) .chev{transform:rotate(-90deg)}
.card-body{padding:.6rem .8rem;font-size:.78rem;line-height:1.6;max-height:320px;overflow-y:auto}

/* Common */
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:700}
.badge-ok{background:#D1FAE5;color:#065F46}.badge-ko{background:#FEE2E2;color:#991B1B}
.kv{display:flex;justify-content:space-between;padding:2px 0}
.k{color:#64748B}.v{font-weight:600}
.v.good{color:var(--green)}.v.bad{color:var(--red)}
.sep{height:1px;background:var(--border);margin:4px 0}
.patri-section{font-weight:700;color:var(--cyan);font-size:.82rem;padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:2px}
.patri-total{font-weight:700;font-size:.9rem;color:var(--navy);margin-top:6px;padding:5px 6px;background:#F1F5F9;border-radius:5px;text-align:center}
.alloc{margin-top:3px;padding:2px 6px;background:#F1F5F9;border-radius:4px;font-size:.72rem}
.cron-row{padding:5px 0;border-bottom:1px solid #F1F5F9}
.cron-top{display:flex;align-items:center;gap:.3rem}
.cron-freq{margin-left:auto;color:#64748B;font-size:.7rem;white-space:nowrap}
.cron-desc{color:var(--muted);font-size:.7rem;padding-left:1.4rem;margin-top:1px}
.pipe-stage{font-weight:700;color:var(--cyan);margin-top:.4rem;padding:2px 0;font-size:.76rem}
.pipe-item{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #F8FAFC}
.pipe-val{font-weight:600}
.pipe-total{display:flex;justify-content:space-between;font-weight:700;background:#F1F5F9;border-radius:4px;padding:3px 6px;margin:3px 0;font-size:.76rem}

/* Todo */
.todo-input{display:flex;gap:6px;margin-bottom:8px}
.todo-input input{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:.82rem}
.todo-input input:focus{outline:none;border-color:var(--cyan)}
.todo-input button{padding:6px 12px;background:var(--cyan);color:#fff;border:none;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.todo-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F1F5F9}
.todo-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer}
.todo-item .text{flex:1;font-size:.8rem}
.todo-item .text.done{text-decoration:line-through;color:var(--muted)}
.todo-item .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:2px 4px}
.todo-item .del:hover{color:var(--red)}
.todo-empty{color:var(--muted);font-style:italic;font-size:.8rem}
.todo-saving{color:var(--cyan);font-size:.7rem;text-align:right}

/* Settings Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:1.5rem;width:90%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{margin-bottom:1rem;font-size:1rem}
.modal input{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:.85rem;margin-bottom:.8rem}
.modal input:focus{outline:none;border-color:var(--cyan)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end}
.modal .btn-sm{padding:6px 16px;font-size:.82rem;border-radius:6px;cursor:pointer;font-weight:600}
.modal .btn-cancel{background:#F1F5F9;color:var(--navy);border:none}
.modal .btn-save{background:var(--cyan);color:#fff;border:none}
.status-msg{font-size:.72rem;margin-bottom:6px}
.status-ok{color:var(--green)}.status-err{color:var(--red)}

/* Loading */
.loading{text-align:center;padding:1rem;color:var(--muted);font-size:.8rem}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.loading::after{content:" ⏳";animation:pulse 1.5s infinite}

@media(max-width:500px){.grid{grid-template-columns:1fr}#dash{padding:.6rem}.header h1{font-size:1.1rem}}
</style></head><body>

<!-- Lock Screen -->
<div id="lock"><div>
<h2>🎛️ Mission Control</h2>
<input type="password" id="pwd" placeholder="Mot de passe" autofocus>
<button type="button" class="btn" id="loginBtn" style="display:block;margin:1rem auto 0">Entrer</button>
<div id="err">Mot de passe incorrect</div>
</div></div>

<!-- Dashboard -->
<div id="dash">
<div class="header">
<h1>🎛️ Mission Control</h1>
<span class="ts" id="ts">Chargement...</span>
<button class="settings-btn" id="settingsBtn" title="Paramètres">⚙️</button>
</div>
<div class="grid" id="cards">
<div class="loading">Chargement du dashboard</div>
</div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="modalBg">
<div class="modal">
<h3>⚙️ Paramètres</h3>
<div id="tokenStatus"></div>
<label style="font-size:.8rem;color:#64748B">Token GitHub (pour éditer la To Do)</label>
<input type="password" id="tokenInput" placeholder="ghp_...">
<div class="actions">
<button class="btn-sm btn-cancel" id="modalCancel">Annuler</button>
<button class="btn-sm btn-save" id="modalSave">Sauvegarder</button>
</div>
</div>
</div>

<script>
const REPO = "svagnier-ux/mission-control";
const BRANCH = "master";
const API = `https://api.github.com/repos/${REPO}/contents`;
const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const PASS_HASH_HEX = null; // computed at runtime

// ── Utils ──
async function sha256(msg){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function getToken(){ return localStorage.getItem("mc_gh_token") || "" }
function setToken(t){ localStorage.setItem("mc_gh_token", t) }

// ── Auth ──
let passHash = null;
(async()=>{ passHash = await sha256("jim2026") })();

function showDash(){
  document.getElementById("lock").style.display="none";
  document.getElementById("dash").style.display="block";
  loadDashboard();
}
if(sessionStorage.getItem("mc")==="1") showDash();

document.getElementById("loginBtn").addEventListener("click", async()=>{
  const h = await sha256(document.getElementById("pwd").value);
  if(h===passHash){ sessionStorage.setItem("mc","1"); showDash() }
  else{ document.getElementById("err").style.display="block" }
});
document.getElementById("pwd").addEventListener("keydown", e=>{
  if(e.key==="Enter"){e.preventDefault();document.getElementById("loginBtn").click()}
});

// ── Settings ──
document.getElementById("settingsBtn").addEventListener("click",()=>{
  const t = getToken();
  document.getElementById("tokenInput").value = t;
  const st = document.getElementById("tokenStatus");
  st.innerHTML = t ? '<div class="status-msg status-ok">✅ Token configuré</div>' : '<div class="status-msg status-err">⚠️ Token requis pour éditer la To Do</div>';
  document.getElementById("modalBg").classList.add("show");
});
document.getElementById("modalCancel").addEventListener("click",()=>{
  document.getElementById("modalBg").classList.remove("show");
});
document.getElementById("modalSave").addEventListener("click",()=>{
  const t = document.getElementById("tokenInput").value.trim();
  if(t) setToken(t);
  document.getElementById("modalBg").classList.remove("show");
  loadTodo(); // reload with new token
});
document.getElementById("modalBg").addEventListener("click", e=>{
  if(e.target===document.getElementById("modalBg")) document.getElementById("modalBg").classList.remove("show");
});

// ── Dashboard Loading ──
async function loadDashboard(){
  try{
    // Load data.json (public, no token needed)
    const r = await fetch(RAW+"/data.json?t="+Date.now());
    if(!r.ok) throw new Error("data.json not found");
    const data = await r.json();
    renderCards(data);
  }catch(e){
    document.getElementById("cards").innerHTML = `<div class="loading" style="animation:none">❌ ${e.message}<br>Le dashboard n'a pas encore été généré.</div>`;
  }
}

function renderCards(data){
  document.getElementById("ts").textContent = "Mis à jour : " + data.updated;
  const cards = data.cards;
  const order = ["aegis","todo","agenda","crons","pipeline","patrimoine"];
  const meta = {
    aegis:{icon:"🤖",title:"AEGIS Live",color:"#10B981"},
    todo:{icon:"📋",title:"To Do",color:"#F59E0B"},
    agenda:{icon:"📅",title:"Agenda",color:"#3B82F6"},
    crons:{icon:"⚙️",title:"Crons",color:"#8B5CF6"},
    pipeline:{icon:"🎯",title:"Pipeline",color:"#0EA5E9"},
    patrimoine:{icon:"💰",title:"Patrimoine",color:"#10B981"},
  };
  let html = "";
  for(const key of order){
    const m = meta[key];
    if(key === "todo"){
      html += `<div class="card"><details open>
        <summary class="card-header" style="border-left:4px solid ${m.color}">
        <span class="icon">${m.icon}</span><span class="card-title">${m.title}</span>
        <span class="chev">▾</span></summary>
        <div class="card-body" id="todoBody"><div class="loading">Chargement</div></div>
        </details></div>`;
    } else if(cards[key]){
      html += `<div class="card"><details open>
        <summary class="card-header" style="border-left:4px solid ${m.color}">
        <span class="icon">${m.icon}</span><span class="card-title">${m.title}</span>
        <span class="chev">▾</span></summary>
        <div class="card-body">${cards[key]}</div>
        </details></div>`;
    }
  }
  document.getElementById("cards").innerHTML = html;
  loadTodo();
}

// ── Todo CRUD ──
let todoSha = null;
let todoTasks = [];
let saving = false;

async function loadTodo(){
  const body = document.getElementById("todoBody");
  if(!body) return;
  
  const token = getToken();
  try{
    let tasks;
    if(token){
      // Use API to get sha (needed for writes)
      const r = await fetch(`${API}/todo.json`,{headers:{"Authorization":`token ${token}`,"Accept":"application/vnd.github.v3+json"}});
      if(r.ok){
        const d = await r.json();
        todoSha = d.sha;
        tasks = JSON.parse(atob(d.content));
      } else {
        tasks = {tasks:[]};
        todoSha = null;
      }
    } else {
      // No token, try raw (read-only)
      const r = await fetch(RAW+"/todo.json?t="+Date.now());
      if(r.ok) tasks = await r.json();
      else tasks = {tasks:[]};
    }
    todoTasks = tasks.tasks || [];
    renderTodo();
  }catch(e){
    body.innerHTML = `<div class="todo-empty">Erreur: ${e.message}</div>`;
  }
}

function renderTodo(){
  const body = document.getElementById("todoBody");
  const token = getToken();
  let html = "";
  
  if(token){
    html += `<div class="todo-input">
      <input type="text" id="todoNew" placeholder="Nouvelle tâche..." maxlength="200">
      <button type="button" onclick="addTodo()">Ajouter</button>
    </div>`;
  }
  
  html += '<div id="todoSaveStatus"></div>';
  
  if(todoTasks.length === 0){
    html += '<div class="todo-empty">Liste vide</div>';
  } else {
    // Active first, done last
    const active = todoTasks.filter(t=>!t.done);
    const done = todoTasks.filter(t=>t.done);
    for(const t of [...active,...done]){
      const checked = t.done ? "checked" : "";
      const cls = t.done ? "text done" : "text";
      html += `<div class="todo-item">
        <input type="checkbox" ${checked} onchange="toggleTodo('${t.id}')" ${!token?"disabled":""}>
        <span class="${cls}">${esc(t.text)}</span>
        ${token ? `<button class="del" onclick="deleteTodo('${t.id}')" title="Supprimer">✕</button>` : ""}
      </div>`;
    }
  }
  
  if(!token){
    html += '<div style="margin-top:8px;font-size:.72rem;color:#94A3B8">⚙️ Configure ton token GitHub pour éditer</div>';
  }
  
  body.innerHTML = html;
  
  // Enter key on input
  const inp = document.getElementById("todoNew");
  if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter") addTodo() });
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

async function addTodo(){
  const inp = document.getElementById("todoNew");
  const text = inp.value.trim();
  if(!text) return;
  inp.value = "";
  todoTasks.push({id:crypto.randomUUID(),text,done:false,created:new Date().toISOString()});
  renderTodo();
  await saveTodo();
}

async function toggleTodo(id){
  const t = todoTasks.find(x=>x.id===id);
  if(t) t.done = !t.done;
  renderTodo();
  await saveTodo();
}

async function deleteTodo(id){
  todoTasks = todoTasks.filter(x=>x.id!==id);
  renderTodo();
  await saveTodo();
}

async function saveTodo(){
  const token = getToken();
  if(!token) return;
  const st = document.getElementById("todoSaveStatus");
  if(st) st.innerHTML = '<div class="todo-saving">Sauvegarde...</div>';
  
  try{
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({tasks:todoTasks},null,2))));
    const body = {message:"Update todo",content,branch:BRANCH};
    if(todoSha) body.sha = todoSha;
    
    const r = await fetch(`${API}/todo.json`,{
      method:"PUT",
      headers:{"Authorization":`token ${token}`,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    
    if(r.ok){
      const d = await r.json();
      todoSha = d.content.sha;
      if(st) st.innerHTML = '<div class="todo-saving" style="color:#10B981">✅ Sauvé</div>';
      setTimeout(()=>{ if(st) st.innerHTML="" }, 1500);
    } else {
      const err = await r.json();
      throw new Error(err.message || r.status);
    }
  }catch(e){
    if(st) st.innerHTML = `<div class="todo-saving" style="color:#EF4444">❌ ${e.message}</div>`;
  }
}
</script></body></html>
